body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--img) center/cover no-repeat;opacity:.13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(rgba(14,30,32,.50),rgba(14,30,32,.62)),var(--img) center 30%/cover;color:#fff;border-bottom:1px solid var(--line);padding:46px 20px 30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:2rem;color:#fff;letter-spacing:.2px;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.logo small{display:block;font-size:.9rem;font-weight:400;color:#f0f6f5;letter-spacing:0}
.badge{margin-left:auto;background:#fff;color:#1f6d68;padding:4px 12px;border-radius:99px;font-size:.85rem;font-weight:600}
main{max-width:980px;margin:0 auto;padding:20px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--l3);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.2rem}h3{margin:0 0 6px;font-size:1.02rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--soft);border-radius:12px;padding:14px}.stat b{display:block;font-size:1.7rem;color:var(--pri)}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
form .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:.88rem;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--pri)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:.82rem;text-decoration:underline}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.mut{color:var(--mut);font-size:.88rem}
.tag{display:inline-block;background:var(--soft);color:var(--pri);border-radius:6px;padding:1px 8px;font-size:.78rem;margin-right:4px}
.lv{font-weight:600;font-size:.85rem;white-space:nowrap}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--warn);padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:2px}
.note{background:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.btn.sec{text-decoration:none;display:inline-block;padding:7px 12px;font-size:.88rem}
.send{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
[hidden]{display:none!important}
.site{background:var(--card);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;gap:4px 18px;flex-wrap:wrap;font-size:.88rem;align-items:center}
.site button{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:8px}.site button.on{background:var(--soft)}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0}
ul{padding-left:20px;margin:6px 0 12px}
.lesson{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:18px;font:inherit;cursor:pointer;display:grid;gap:4px;justify-items:center;text-align:center}
.lesson:hover,.opt:hover{border-color:var(--pri)}
.big{font-size:2.6rem;line-height:1.2}.center{text-align:center}
.vis{font-size:5rem;line-height:1.2;margin:10px 0 18px;min-height:90px}
.dot{display:inline-block;width:90px;height:90px;border-radius:50%}
.cnt{font-size:2.8rem;letter-spacing:10px;color:var(--pri)}

<script>
/* Modo local: se a página não estiver no claude.ai, os dados ficam neste navegador (localStorage). */
if(typeof claude==='undefined'){
(function(){
  const KEY='integracore_local_db_v1';let mem=null;
  const load=()=>{if(mem)return mem;try{mem=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){mem={}}return mem};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}};
  const listeners={};
  const split=p=>{const a=p.split('/');return [a.slice(0,-1).join('/'),a[a.length-1]]};
  const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(15)),x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('');
  const snap=c=>({docs:Object.entries(load()[c]||{}).map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}))});
  const notify=c=>(listeners[c]||[]).forEach(f=>{try{f(snap(c))}catch(e){}});
  const put=(c,id,d)=>{const m=load();(m[c]=m[c]||{})[id]=d;save();notify(c)};
  const doc=p=>{const [c,id]=split(p);return {
    async get(){const d=(load()[c]||{})[id];return {exists:!!d,id,data:()=>d?JSON.parse(JSON.stringify(d)):undefined}},
    async set(d){put(c,id,JSON.parse(JSON.stringify(d)))},
    async update(d){const o=(load()[c]||{})[id];if(!o)throw new Error('not-found');put(c,id,{...o,...JSON.parse(JSON.stringify(d))})},
    async delete(){const m=load();if(m[c]){delete m[c][id];save();notify(c)}}}};
  const collection=c=>({
    onSnapshot(ok){(listeners[c]=listeners[c]||[]).push(ok);setTimeout(()=>ok(snap(c)),0);return ()=>{listeners[c]=listeners[c].filter(f=>f!==ok)}},
    async add(d){const id=rid();put(c,id,JSON.parse(JSON.stringify(d)));return {id}}});
  const db={doc,collection};
  const user={async canEdit(){return true},id:'local'};
  const downloads={async save({filename,data}){const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}};
  window.claude={use:async n=>({user,db,downloads})[n]};
  window.__integracoreLocal=true;
})();
}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV={4:'Independente',3:'Com apoio verbal',2:'Com apoio físico',1:'Ainda não realiza'};
const AREAS=['Comunicação','Interação social','Autonomia','Cognição','Motricidade','Rotina e sensorial'];
const SUP=['Nível 1 de suporte','Nível 2 de suporte','Nível 3 de suporte'];
const S={prints:[],pv:null,rot:null,page:null,sub:'rotina',plays:[],att:[],notices:[],play:null,accs:[],contacts:{},kids:[],lessons:[],results:[],tab:'painel',admin:false,uid:null,links:[],kid:null,db:null,ok:false,err:null};
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>new Date(d+'T00:00').toLocaleDateString('pt-BR');
const kidOf=id=>S.kids.find(k=>k.id===id);
const lesOf=id=>S.lessons.find(l=>l.id===id);
const avg=a=>a.length?a.reduce((x,y)=>x+y.level,0)/a.length:0;
const pct=v=>Math.round(v/4*100);
const lv=n=>`<span class="lv" style="color:var(--l${n})">● ${LV[n]}</span>`;
const opts=(a,sel)=>a.map(([v,t])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`).join('');
const genCode=()=>Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
async function mkAcc(p){const salt=crypto.getRandomValues(new Uint8Array(16));return {salt:b64(salt),hash:await hashPw(p,salt)}}
const genPw=()=>Array.from(crypto.getRandomValues(new Uint8Array(9)),x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('');
const idle=()=>!S.page&&!S.rot&&!S.pv&&!document.activeElement?.matches('input,textarea,select');

async function init(){
  const user=await claude.use('user'); const db=await claude.use('db');
  if(!user||!db){$('#role').textContent='Sem acesso';$('#app').innerHTML='<div class="card"><h2>Entre para continuar</h2><p>Abra o link estando conectado(a) ao claude.ai com a permissão de acesso concedida pela instituição.</p></div>';return}
  S.db=db;S.dl=await claude.use('downloads');S.owner=await user.canEdit();
  try{const a=await db.doc('accounts/admin').get();S.setup=S.owner&&!a.exists}catch(e){}
  $('#role').textContent=window.__integracoreLocal?'Acesso restrito · modo local':'Acesso restrito';
  render();
}

function startData(){
  const db=S.db;
  if(!S.started){S.started=true;
    for(const [k,c] of [['kids','children'],['lessons','lessons'],['results','results'],['plays','plays'],['att','attendance'],['notices','notices'],['prints','prints']])
      db.collection(c).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(idle())render()},e=>{S.err=e.code;render()});}
  if(S.admin&&!S.adminSub){S.adminSub=true;
    db.collection('contacts').onSnapshot(s=>{S.contacts=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(idle())render()},()=>{});
    db.collection('accounts').onSnapshot(s=>{S.accs=s.docs.map(d=>({id:d.id,...d.data()}));if(idle())render()},()=>{});}
}

function loginView(){
  const box='<div class="card" style="max-width:420px;margin:30px auto">';
  if(S.setup)return box+'<h2>Primeiro acesso da instituição</h2><p class="mut">Crie a senha do usuário <b>admin</b>.</p><form data-f="setup"><label class="full">Senha (mínimo 8 caracteres)<input name="p" type="password" minlength="8" required autocomplete="new-password"></label><label class="full">Confirmar senha<input name="p2" type="password" minlength="8" required autocomplete="new-password"></label><div class="full"><button class="btn">Criar senha</button></div></form></div>';
  return box+'<h2>Entrar</h2><form data-f="login"><label class="full">Usuário<input name="u" required autocomplete="username" autocapitalize="none"></label><label class="full">Senha<input name="p" type="password" required autocomplete="current-password"></label><div class="full"><button class="btn">Entrar</button></div></form><p class="mut">Instituição: usuário <b>admin</b>. Pais e responsáveis: usuário e senha fornecidos pela escola.</p></div>';
}

function sendTxt(c,sub,m){let h='';
  if(c.email)h+=`<a class="btn sec" target="_blank" rel="noopener" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(m)}">Enviar por e-mail</a>`;
  if(c.phone)h+=`<a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/${phone(c.phone)}?text=${encodeURIComponent(m)}">Enviar por WhatsApp</a>`;
  return `<div class="send">${h}</div>`}

function acessos(){
  const n=S.newpw,c=n?(S.contacts[n.kid]||{}):{};
  const note=n?`<div class="note"><b>Acesso pronto.</b> Usuário: <span class="code">${esc(n.u)}</span> Senha: <span class="code">${esc(n.p)}</span><br>Envie ao responsável agora: a senha não poderá ser vista de novo.${sendTxt(c,'Seu acesso ao Integracore','Olá! Seu acesso ao Integracore para acompanhar as atividades do seu filho(a). Usuário: '+n.u+' Senha: '+n.p)}</div>`:'';
  return note+(S.admin?qrCard('','QR code do site para as famílias'):'')+`<div class="card"><h2>Criar acesso para pais</h2><form data-f="acc">
  <label>Usuário<input name="u" required minlength="3" maxlength="30" placeholder="ex.: maria.silva" autocapitalize="none"></label>
  <label>Nome do responsável<input name="name" maxlength="80"></label>
  <label class="full">Filhos vinculados (Ctrl/Cmd para escolher vários)<select name="kids" multiple size="4" required>${opts(S.kids.map(k=>[k.id,k.name]))}</select></label>
  <div class="full"><button class="btn">Criar acesso e gerar senha</button></div></form></div>
  <div class="card"><h2>Acessos criados</h2>${S.accs.filter(a=>a.role==='pai').map(a=>`<div class="row"><div><b>${esc(a.id)}</b> <span class="mut">${esc(a.name)}</span><div class="mut">${(a.kids||[]).map(i=>esc(kidOf(i)?.name||'?')).join(', ')}</div></div><div><button class="x" data-reset="${esc(a.id)}">redefinir senha</button> <button class="x" data-del="accounts/${esc(a.id)}">excluir</button></div></div>`).join('')||'<p class="empty">Nenhum acesso criado.</p>'}</div>`;
}

function render(){
  document.querySelectorAll('#menu [data-page]').forEach(b=>b.classList.toggle('on',(S.page||'home')===b.dataset.page));
  if(S.page){$('#app').innerHTML=PG[S.page]();return}
  if(!S.me){$('#app').innerHTML=loginView();return}
  const tabs=S.admin?[['painel','Painel'],['criancas','Crianças'],['conteudos','Conteúdos'],['registro','Registrar aplicação'],['sala','Sala de lições'],['freq','Frequência e recados'],['imprimir','Atividades para imprimir'],['roteiros','Roteiros animados'],['acessos','Acessos']]:[['filho','Acompanhamento'],['sala','Sala de lições'],['roteiros','Roteiros animados'],['imprimir','Para imprimir']];
  let h='<nav>'+tabs.map(([k,t])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${t}</button>`).join('')+'</nav>';
  if(S.err)h+=`<div class="note">Não foi possível ler os dados (${esc(S.err)}). Peça acesso à instituição.</div>`;
  h+={painel,criancas,conteudos,registro,acessos,sala,filho,freq,imprimir,roteiros}[S.tab]();
  $('#app').innerHTML=h;
}

const phone=p=>{p=String(p||'').replace(/\D/g,'');return p.length<=11?'55'+p:p};
function msg(k){const c=S.contacts[k.id]||{};const rs=S.results.filter(r=>r.childId===k.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
 return `Olá${c.guardian?', '+c.guardian:''}! Atualização de ${k.name} no Integracore:\n`+(rs.map(r=>`• ${fd(r.date)} - ${lesOf(r.lessonId)?.title||'Atividade'}: ${LV[r.level]}${r.notes?' ('+r.notes+')':''}`).join('\n')||'Ainda sem atividades registradas.')+`\nPara ver o histórico completo, acesse o Integracore com seu usuário e senha.`}
function send(k){const c=S.contacts[k.id]||{},m=msg(k);let h='';
 if(c.email)h+=`<a class="btn sec" target="_blank" rel="noopener" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('Integracore - acompanhamento de '+k.name)}&body=${encodeURIComponent(m)}">Enviar e-mail</a>`;
 if(c.phone)h+=`<a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/${phone(c.phone)}?text=${encodeURIComponent(m)}">Enviar WhatsApp</a>`;
 return `<div class="send">${h||'<span class="mut">Sem e-mail ou WhatsApp cadastrado.</span>'}</div>`}

function playsCard(id){const ps=S.plays.filter(p=>p.childId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
 return `<div class="card"><h2>Sala de lições: resultados</h2>${ps.map(p=>`<div class="row"><div><b>${esc(LESS[p.lesson]?.name||p.lesson)}</b><div class="mut">${fd(p.date)}</div></div><div style="text-align:right"><b>${p.ok}/${p.total}</b> <span class="mut">acertos de primeira</span><div class="bar" style="width:140px"><i style="width:${Math.round(p.ok/p.total*100)}%"></i></div></div></div>`).join('')||'<p class="empty">Nenhuma lição feita ainda.</p>'}</div>`}
function sala(){
  const kids=S.admin?S.kids:(S.me.kids||[]).map(kidOf).filter(Boolean);
  if(!kids.length)return '<div class="card"><p class="empty">Nenhuma criança disponível.</p></div>';
  if(!kids.find(k=>k.id===S.kid))S.kid=kids[0].id;
  const P=S.play;
  const sel=kids.length>1?`<label style="max-width:300px;margin-bottom:14px">Criança<select data-kidsel>${opts(kids.map(k=>[k.id,k.name]),S.kid)}</select></label>`:'';
  if(!P)return sel+`<div class="card"><h2>Sala de lições</h2><p class="mut">Atividades curtas, sem tempo e sem pressão. Cada lição tem 5 perguntas e pode ser repetida. O resultado fica salvo para a família e a escola acompanharem.</p><div class="grid">${Object.entries(LESS).map(([k,l])=>`<button class="lesson" data-start="${k}"><span class="big">${l.icon}</span><b>${l.name}</b><span class="mut">${l.area}</span></button>`).join('')}</div></div>`+playsCard(S.kid);
  const L=LESS[P.lesson];
  if(P.done)return `<div class="card center"><h2>Lição concluída!</h2><p class="big">⭐</p><p>${P.ok} de ${L.q.length} acertos de primeira.</p><p class="mut">${P.saved?'Resultado salvo.':'Não foi possível salvar o resultado (peça à escola permissão de colaborador).'}</p><button class="btn" data-start="${P.lesson}">Fazer de novo</button> <button class="btn sec" data-exit="1">Voltar à sala</button></div>`;
  const q=L.q[P.i];
  return `<div class="card center"><div class="mut">${L.name} · pergunta ${P.i+1} de ${L.q.length}</div><h2>${esc(q.p)} <button class="x" data-say="${esc(q.p)}">Ouvir</button></h2><div class="vis">${q.v}</div><div class="opts">${P.opts.map(o=>`<button class="opt${P.wrong.includes(o)?' soft':''}" data-ans="${esc(o)}">${esc(o)}</button>`).join('')}</div><p class="fb">${P.fb||'&nbsp;'}</p><button class="x" data-exit="1">Sair da lição</button></div>`;
}

const NOTE='<p class="mut">Conteúdo educativo. Não substitui a avaliação de profissionais de saúde e educação.</p>';
const SUBS=[['rotina','Rotina e previsibilidade'],['comunic','Comunicação'],['sensorial','Sensorial'],['familia','Família e escola']];
const CONV={
 rotina:'<h3>Rotina e previsibilidade</h3><p>Muitas crianças autistas ficam mais seguras quando sabem o que vai acontecer. Algumas ideias:</p><ul><li>Use agenda visual com figuras ou fotos: primeiro..., depois....</li><li>Avise as mudanças com antecedência e mostre o que continua igual.</li><li>Anuncie as transições ("em 5 minutos vamos guardar os brinquedos"), com apoio visual ou um temporizador.</li><li>Mantenha horários regulares de sono, refeições e estudo, dentro do possível.</li><li>Para situações novas, prepare a criança com fotos, vídeos ou pequenas histórias sociais.</li></ul>',
 comunic:'<h3>Comunicação</h3><p>Comunicar não é só falar. Gestos, olhares, figuras, cartões, prancha e aplicativos de comunicação alternativa também são linguagem.</p><ul><li>Use frases curtas, claras e concretas, uma instrução por vez.</li><li>Dê tempo para a criança responder antes de repetir o pedido.</li><li>Evite ironias e duplo sentido com quem entende tudo ao pé da letra.</li><li>Não force contato visual: muitas crianças escutam melhor sem olhar nos olhos.</li><li>Valorize qualquer tentativa de comunicação e responda a ela.</li></ul>',
 sensorial:'<h3>Sensorial</h3><p>Sons, luzes, cheiros, texturas e toques podem ser intensos demais (ou de menos) para a criança.</p><ul><li>Observe o que costuma incomodar: barulho de liquidificador, etiquetas de roupa, luz forte, multidão.</li><li>Ofereça abafador de ruído, boné, roupas confortáveis e um canto calmo para pausas.</li><li>Sinais de sobrecarga: tapar os ouvidos, irritação súbita, fuga, choro. Reduza os estímulos antes de pedir qualquer tarefa.</li><li>Movimentos repetitivos inofensivos ajudam na regulação; não precisam ser proibidos.</li><li>Introduza alimentos e texturas novas aos poucos, sem pressão.</li></ul>',
 familia:'<h3>Família e escola</h3><p>O progresso é maior quando casa e escola caminham juntas.</p><ul><li>Troquem informações com frequência: o que funcionou, o que cansou, o que a criança gostou.</li><li>Peça à escola um plano educacional individualizado, com adaptações de atividades e do ambiente.</li><li>Comemore pequenas conquistas e compare a criança apenas com ela mesma.</li><li>Cuide de quem cuida: descanso, rede de apoio e grupos de famílias fazem diferença.</li><li>Use o Integracore para acompanhar as lições, os resultados e as observações da escola.</li></ul>'};
const PG={
 oque:()=>`<div class="card"><h2>O que é o Autismo?</h2><p>O Transtorno do Espectro Autista (TEA) é uma condição do neurodesenvolvimento. Não é doença, não é causado pela forma como os pais criam o filho e não tem "cura". Com apoio adequado, a pessoa autista aprende, se comunica e pode ter autonomia e qualidade de vida.</p><h3>Por que "espectro"?</h3><p>Porque cada pessoa é única. Algumas falam pouco ou não falam; outras falam muito e têm interesses profundos. As necessidades de apoio também variam: costuma-se falar em três níveis de suporte (1, 2 e 3).</p><h3>Características comuns</h3><ul><li>Jeitos próprios de se comunicar e de interagir socialmente.</li><li>Interesses intensos e preferência por rotina e previsibilidade.</li><li>Movimentos repetitivos, que costumam ajudar na regulação.</li><li>Sensibilidade diferente a sons, luzes, texturas, cheiros e sabores.</li></ul><h3>Quando buscar avaliação</h3><p>Não responder ao nome, pouco interesse em interagir, atraso ou perda da fala e brincar sempre do mesmo jeito merecem uma conversa com o pediatra. O diagnóstico é clínico, feito por profissionais de saúde, e quanto antes o apoio começa, melhor.</p><h3>Direitos</h3><p>No Brasil, a Lei 12.764/2012 (Lei Berenice Piovesan) garante à pessoa com TEA os direitos das pessoas com deficiência, e a Lei Brasileira de Inclusão (13.146/2015) assegura matrícula e adaptações na escola. O Dia Mundial de Conscientização do Autismo é 2 de abril.</p>${NOTE}</div>`,
 conviv:()=>`<div class="card"><h2>Convivendo com o TEA</h2><div class="chips">${SUBS.map(([k,t])=>`<button class="btn ${S.sub===k?'':'sec'}" data-sub="${k}">${t}</button>`).join('')}</div>${CONV[S.sub]}${NOTE}</div>`,
 trabalho:()=>`<div class="card"><h2>Nosso Trabalho</h2><p>O Integracore aproxima escola e família no desenvolvimento de crianças autistas, com foco em previsibilidade, respeito ao ritmo de cada uma e acompanhamento transparente.</p><ul><li><b>Cadastro individual:</b> perfil, nível de suporte, preferências e sensibilidades de cada criança.</li><li><b>Biblioteca de conteúdos:</b> lições organizadas por área (comunicação, interação social, autonomia, cognição, motricidade, rotina e sensorial).</li><li><b>Registro de aplicações:</b> a cada atividade, a escola anota o nível de autonomia e observações.</li><li><b>Sala de lições:</b> atividades curtas e sem pressão, com leitura em voz alta.</li><li><b>Acompanhamento dos pais:</b> acesso com usuário e senha para ver a evolução por área e o histórico.</li><li><b>Comunicação direta:</b> envio de atualizações por e-mail e WhatsApp.</li></ul></div>`,
 quem:()=>`<div class="card"><h2>Quem Somos</h2><p>O Integracore é uma plataforma de integração entre escola e família para o acompanhamento pedagógico de crianças autistas. Acreditamos que cada criança aprende de um jeito, que a família é parte essencial do processo e que o progresso deve ser visível, registrado e comemorado.</p><h3>Nossos princípios</h3><ul><li>Respeito à individualidade e ao ritmo de cada criança.</li><li>Parceria entre família e instituição.</li><li>Transparência nos resultados e nas observações.</li><li>Cuidado com os dados: só a instituição cadastra e cada responsável acessa com usuário e senha.</li></ul></div>`,
 blog:()=>`<div class="card"><h2>Blog</h2>${[
  ['Como montar uma rotina visual em casa','Escolha de 4 a 6 momentos do dia (acordar, café, escola, brincar, banho, dormir). Imprima uma figura para cada um e fixe em ordem, em local à altura da criança. Ao concluir cada etapa, ela vira o cartão ou o move para "feito". Comece com poucas etapas e aumente aos poucos. A rotina visual reduz a ansiedade e ajuda nas transições.'],
  ['Sinais de sobrecarga sensorial','Tapar os ouvidos, fechar os olhos, ficar irritada de repente, correr para longe ou se esconder podem indicar excesso de estímulos. Antes de insistir na tarefa, diminua barulho e luz, ofereça uma pausa em local calmo e volte com tranquilidade.'],
  ['Conversando com a escola sobre adaptações','Leve exemplos do que funciona em casa, peça um plano individual e combine uma forma de troca de informações (bilhete, aplicativo, reunião). Perguntas úteis: como será a rotina, quem apoia a criança, como serão avisadas mudanças e como os resultados serão registrados.']
 ].map(([t,x])=>`<details><summary>${t}</summary><p>${x}</p></details>`).join('')}</div>`,
 faq:()=>`<div class="card"><h2>Perguntas frequentes</h2>${[
  ['O autismo tem cura?','Não. O autismo é uma condição de neurodesenvolvimento. O que existe são apoios e terapias que ajudam a criança a se comunicar, aprender e ganhar autonomia.'],
  ['Vacinas causam autismo?','Não. Estudos científicos em vários países não encontraram relação entre vacinas e autismo.'],
  ['Toda criança autista fala?','Não. Algumas falam, outras falam pouco ou não falam e se comunicam por gestos, figuras, pranchas ou aplicativos. Todas se comunicam de algum modo.'],
  ['Quem faz o diagnóstico?','Profissionais de saúde, como médico neuropediatra, psiquiatra infantil ou pediatra com experiência, geralmente com apoio de psicólogos, fonoaudiólogos e terapeutas ocupacionais.'],
  ['Como recebo meu acesso ao Integracore?','A escola cria o seu usuário e a sua senha e envia por e-mail ou WhatsApp. Se perder a senha, peça a redefinição à instituição.'],
  ['Para que serve a Sala de lições?','Para a criança praticar atividades curtas, sem tempo e sem pressão. Os resultados ficam salvos para a família e a escola acompanharem.']
 ].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`,
 contato:()=>`<div class="card"><h2>Contato</h2><p>Para dúvidas sobre lições, resultados, cadastro ou acesso, fale diretamente com a coordenação da escola pelos canais que ela informou (e-mail ou WhatsApp). Para trocar a senha, peça a redefinição à instituição.</p><p class="mut">A escola pode incluir aqui o endereço, o telefone e o horário de atendimento.</p></div>`
};

function registro(){
  if(!S.kids.length||!S.lessons.length)return '<div class="card"><p class="empty">Cadastre ao menos uma criança e um conteúdo antes de registrar aplicações.</p></div>';
  const lk=kidOf(S.last);

function noticesView(id){

function backupCard(){return `<div class="card"><h2>Backup dos dados (CSV)</h2><p class="mut">Baixe uma cópia em planilha. Atenção: o arquivo de crianças inclui contatos dos responsáveis; guarde com cuidado.</p><div class="chips">${[['children','Crianças'],['results','Aplicações'],['attendance','Frequência'],['notices','Recados'],['lessons','Conteúdos']].map(([k,t])=>`<button class="btn sec" data-csv="${k}">${t}</button>`).join('')}</div></div>`}
async function exportCsv(k){
  if(!S.dl){alert('O download não está disponível neste dispositivo.');return}
  const src={children:S.kids.map(x=>({...x,...(S.contacts[x.id]||{})})),results:S.results,attendance:S.att,notices:S.notices,lessons:S.lessons}[k];
  if(!src.length){alert('Ainda não há dados para exportar.');return}
  const cols=[...new Set(src.flatMap(r=>Object.keys(r)))];
  const cell=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const csv='\ufeff'+[cols.map(cell),...src.map(r=>cols.map(c=>cell(r[c])))].map(r=>r.join(',')).join('\r\n');
  try{await S.dl.save({filename:`integracore-${k}-${today()}.csv`,data:new Blob([csv],{type:'text/csv;charset=utf-8'})})}catch(x){if(x?.code!=='declined')alert('Não foi possível gerar o arquivo.')}
}

document.addEventListener('change',e=>{if(e.target.dataset.kidsel!==undefined){S.kid=e.target.value;S.play=null;render()}});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-kid],[data-del],[data-reset],[data-out],[data-start],[data-ans],[data-say],[data-exit],[data-page],[data-sub],[data-csv]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.pv=null;if(S.rot){S.rot=null;rotStop()}render()}
  else if(t.dataset.kid){S.kid=t.dataset.kid;render()}
  else if(t.dataset.reset){try{const a=S.accs.find(x=>x.id===t.dataset.reset),p=genPw();await S.db.doc('accounts/'+a.id).update(await mkAcc(p));S.newpw={u:a.id,p,kid:(a.kids||[])[0]};render()}catch(x){alert('Não foi possível redefinir.')}}
  else if(t.dataset.out){S.pv=null;S.rot=null;rotStop();S.me=null;S.admin=false;S.newpw=null;$('#role').textContent='Acesso restrito';$('#out').hidden=true;render()}
  else if(t.dataset.start){const k=t.dataset.start;S.play={lesson:k,i:0,ok:0,tried:false,wrong:[],fb:'',opts:shuf(LESS[k].q[0].o)};render()}
  else if(t.dataset.page){S.page=t.dataset.page==='home'?null:t.dataset.page;render();scrollTo(0,0)}
  else if(t.dataset.csv){exportCsv(t.dataset.csv)}
  else if(t.dataset.sub){S.sub=t.dataset.sub;render()}
  else if(t.dataset.exit){S.play=null;render()}
  else if(t.dataset.say){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.dataset.say);u.lang='pt-BR';speechSynthesis.speak(u)}}
  else if(t.dataset.ans!==undefined){const P=S.play,L=LESS[P.lesson],q=L.q[P.i],o=t.dataset.ans;if(P.lock)return;
    if(o===q.a){P.lock=true;if(!P.tried)P.ok++;P.fb='Muito bem!';render();
      setTimeout(async()=>{P.lock=false;P.i++;
        if(P.i>=L.q.length){P.done=true;try{await S.db.collection('plays').add({childId:S.kid,lesson:P.lesson,ok:P.ok,total:L.q.length,date:today(),by:S.me.u});P.saved=true}catch(x){P.saved=false}}
        else{P.tried=false;P.wrong=[];P.fb='';P.opts=shuf(L.q[P.i].o)}
        render()},1000)}
    else{P.tried=true;P.wrong.push(o);P.fb='Quase! Vamos tentar de novo.';render()}}
  else if(t.dataset.del&&confirm('Excluir este item?')){try{await S.db.doc(t.dataset.del).delete();if(t.dataset.del.startsWith('children/'))await S.db.doc('contacts/'+t.dataset.del.split('/')[1]).delete()}catch(x){alert('Não foi possível excluir.')}}
});

document.addEventListener('submit',async e=>{
  const f=e.target.dataset.f;if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  try{
    if(f==='login'){
      const u=d.u.trim().toLowerCase();let x=null;
      if(/^[a-z0-9._-]{3,30}$/.test(u)){const a=await S.db.doc('accounts/'+u).get();x=a.exists&&a.data()}
      if(!x||await hashPw(d.p,unb(x.salt))!==x.hash){alert('Usuário ou senha incorretos.');return}
      if(x.role==='admin'&&!S.owner){alert('Esta conta exige permissão de administrador no claude.ai.');return}
      S.me={u,role:x.role,name:x.name,kids:x.kids||[]};S.admin=x.role==='admin';S.tab=S.admin?'painel':'filho';
      $('#role').textContent=S.admin?'Instituição':'Pais / Responsáveis';$('#out').hidden=false;startData();icHash();render();return}
    if(f==='setup'){
      if(d.p!==d.p2){alert('As senhas não coincidem.');return}
      await S.db.doc('accounts/admin').set({role:'admin',name:'Instituição',...await mkAcc(d.p)});S.setup=false;alert('Senha criada. Agora entre com o usuário admin.');render();return}
    if(f==='acc'){
      const u=d.u.trim().toLowerCase(),kids=new FormData(e.target).getAll('kids');
      if(!/^[a-z0-9._-]{3,30}$/.test(u)||u==='admin'){alert('Usuário inválido: use 3 a 30 letras minúsculas, números, ponto ou hífen.');return}
      if((await S.db.doc('accounts/'+u).get()).exists){alert('Esse usuário já existe.');return}
      const p=genPw();await S.db.doc('accounts/'+u).set({role:'pai',name:d.name,kids,...await mkAcc(p)});
      S.newpw={u,p,kid:kids[0]};e.target.reset();render();return}
    if(f==='kid'){if(d.cpf&&!IC.cpfOk(d.cpf)){alert('CPF inválido. Confira os números.');return}const {guardian,email,phone,cpf,cep,rua,numero,bairro,cidade,uf,...kd}=d;const r=await S.db.collection('children').add({...kd,age:Number(kd.age),code:genCode()});await S.db.doc('contacts/'+r.id).set({guardian,email,phone,cpf,cep,rua,numero,bairro,cidade,uf:(uf||'').toUpperCase()})}
    else if(f==='lesson'){await S.db.collection('lessons').add(d)}
    else if(f==='att'){await S.db.collection('attendance').add(d)}
    else if(f==='notice'){await S.db.collection('notices').add({...d,date:today()})}
    else if(f==='result'){await S.db.collection('results').add({...d,level:Number(d.level)});S.last=d.childId}
    else if(f==='link'){
      const c=d.code.trim().toUpperCase();
      if(!S.kids.find(k=>k.code===c)){alert('Código não encontrado. Confira com a escola.');return}
      if(!S.links.includes(c))S.links.push(c);
      try{localStorage.setItem('ic_links',JSON.stringify(S.links))}catch(x){}
      try{await S.db.doc('data/users/'+S.uid+'/links').set({codes:S.links})}catch(x){}
    }
    e.target.reset();render();
  }catch(x){alert('Não foi possível concluir a ação. Verifique suas permissões de acesso.')}
});

let RTM=null;
function rotStop(){clearInterval(RTM);RTM=null;if('speechSynthesis' in window)speechSynthesis.cancel()}
function rotSay(){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(RT[S.rot.id].s[S.rot.i][1]);u.lang='pt-BR';speechSynthesis.speak(u)}}
function rotGo(n){const r=S.rot,L=RT[r.id].s.length;r.i=(n+L)%L;render()}
function rotAuto(){clearInterval(RTM);RTM=setInterval(()=>{const r=S.rot;if(!r){rotStop();return}if(r.i<RT[r.id].s.length-1)rotGo(r.i+1);else{r.auto=false;clearInterval(RTM);render()}},S.rot.slow?10000:6000)}
function rotAct(a){const r=S.rot;if(!r)return;
 if(a==='say')rotSay();else if(a==='prev')rotGo(r.i-1);else if(a==='next')rotGo(r.i+1);
 else if(a==='slow'){r.slow=!r.slow;if(r.auto)rotAuto();render()}
 else if(a==='auto'){r.auto=!r.auto;if(r.auto)rotAuto();else clearInterval(RTM);render()}}
function rotView(){const R=RT[S.rot.id],i=S.rot.i,s=R.s[i],last=i===R.s.length-1;
 return `<div class="card center"><div class="mut">${R.n} · passo ${i+1} de ${R.s.length}</div>
 <div class="strip">${R.s.map((x,j)=>`<span class="stp${j===i?' on':''}${j<i?' dn':''}">${j<i?'✔':x[0]}</span>`).join('')}</div>
 <div class="vis"><span class="sc a-${s[2]}">${s[0]}</span></div><h2>${esc(s[1])}</h2>
 <div class="opts"><button class="opt" data-rs="prev"${i?'':' disabled'}>◀ Voltar</button><button class="opt" data-rs="say">🔊 Ouvir</button><button class="opt" data-rs="next">${last?'Recomeçar':'Próximo ▶'}</button></div>
